<body>

<div class="box">
  <h1>end.lat</h1>
  <p class="tagline">Paste a link, get a <span class="gradient-text">end.lat</span> one back.</p>

  <div class="field">
    <label for="url">Destination URL</label>
    <input class="text-input" id="url" type="text" placeholder="https://example.com/a/very/long/path" autocomplete="off" spellcheck="false">
  </div>

  <div class="field">
    <label for="keyword">
      <span>Custom Keyword</span>
      <span class="optional-tag">optional</span>
    </label>
    <div class="prefix-input-wrap" id="keywordWrap">
      <span class="prefix-label">end.lat/</span>
      <input id="keyword" type="text" placeholder="my-custom-name" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="hint" id="hint"></div>

  <button id="go" onclick="shorten()">Shorten</button>

  <div class="output-container">
    <div class="result" id="resultBox">
      <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy</button>
    </div>
    <div class="placeholder" id="placeholder">Your link will appear right here</div>
  </div>

<script>
const urlInput = document.getElementById('url');
const keywordInput = document.getElementById('keyword');
const keywordWrap = document.getElementById('keywordWrap');
const hint = document.getElementById('hint');
const goBtn = document.getElementById('go');
const resultBox = document.getElementById('resultBox');
const placeholder = document.getElementById('placeholder');
const shortLink = document.getElementById('shortLink');
const copyBtn = document.getElementById('copyBtn');

function setError(msg) {
  hint.textContent = msg;
  urlInput.classList.toggle('error', !!msg);
}

function cleanSlug(val) {
  if (!val) return '';
  let str = val.trim();
  try {
    if (str.startsWith('http://') || str.startsWith('https://')) {
      const parsed = new URL(str);
      str = parsed.pathname;
    }
  } catch {}
  str = str.replace(/^https?:\/\/[^/]+/i, '');
  str = str.replace(/^end\.lat\/?/i, '');
  str = str.replace(/^\/+|\/+$/g, '');
  return str;
}

function isLikelyUrl(value) {
  try {
    const withScheme = /^https?:\/\//i.test(value) ? value : 'https://' + value;
    new URL(withScheme);
    return withScheme;
  } catch {
    return null;
  }
}

async function shorten() {
  setError('');
  keywordWrap.classList.remove('error');

  const raw = urlInput.value.trim();
  const rawKeyword = cleanSlug(keywordInput.value);

  if (!raw) {
    setError('Enter a URL first.');
    urlInput.focus();
    return;
  }

  const normalized = isLikelyUrl(raw);
  if (!normalized) {
    setError("That doesn't look like a valid URL.");
    return;
  }

  if (rawKeyword && !/^[a-zA-Z0-9_-]{1,64}$/.test(rawKeyword)) {
    keywordWrap.classList.add('error');
    setError('Keyword can only contain letters, numbers, hyphens, and underscores.');
    keywordInput.focus();
    return;
  }

  goBtn.disabled = true;
  goBtn.textContent = 'Shortening…';

  resultBox.classList.remove('show');
  placeholder.classList.remove('hidden');

  try {
    let endpoint = '/api?url=' + encodeURIComponent(normalized);
    if (rawKeyword) {
      endpoint += '&keyword=' + encodeURIComponent(rawKeyword);
    }

    const res = await fetch(endpoint);
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Failed to create short link.');
    }

    if (!data || !data.short) {
      throw new Error('No short link in response.');
    }

    shortLink.textContent = data.short;
    shortLink.href = data.short;

    placeholder.classList.add('hidden');
    resultBox.classList.remove('show');
    void resultBox.offsetWidth;
    resultBox.classList.add('show');
  } catch (err) {
    setError(err.message || "Couldn't reach the end.lat API. Try again in a moment.");
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = 'Shorten';
  }
}

async function copyLink() {
  const text = shortLink.textContent;
  if (!text) return;

  try {
    await navigator.clipboard.writeText(text);
    copyBtn.textContent = 'Copied';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }, 1600);
  } catch {
    copyBtn.textContent = 'Failed';
  }
}

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') shorten();
});

keywordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') shorten();
});

urlInput.addEventListener('input', () => {
  setError('');
});

keywordInput.addEventListener('input', () => {
  setError('');
  keywordWrap.classList.remove('error');
});
</script>
