<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>end</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #000000;
    --surface:  #111111;
    --border:   #262626;
    --border-2: #333333;
    --text:     #F5F5F5;
    --muted:    #8A8A8A;
    --accent:   #FFFFFF;
    --ok:       #4ADE80;
    --err:      #F87171;
    --radius:   14px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html { font-family: var(--font); }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-feature-settings: 'ss01' 1, 'cv05' 1, 'cv11' 1;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .box {
    width: 380px;
    max-width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
  }

  h1 {
    text-align: center;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0 0 6px;
  }

  @keyframes rainbow-shift {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .gradient-text {
    background: linear-gradient(
      90deg,
      #ff5f6d, #ffc371, #f9f871, #6dffb0, #5ed7ff, #a78bfa, #ff5fc4, #ff5f6d
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    font-weight: 600;
    animation: rainbow-shift 6s linear infinite;
  }

  .tagline {
    text-align: center;
    margin: 0 0 26px;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: -0.005em;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input#url {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input#url::placeholder { color: #555; }

  input#url:focus {
    border-color: var(--border-2);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
  }

  input#url.error {
    border-color: var(--err);
    box-shadow: 0 0 0 3px rgba(248,113,113,0.12);
  }

  .hint {
    margin: 8px 2px 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--err);
    min-height: 15px;
  }

  button#go {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border-radius: 9px;
    border: none;
    background: var(--accent);
    color: #000;
    font-family: var(--font);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  button#go:hover { opacity: 0.88; }
  button#go:active { transform: scale(0.98); }
  button#go:disabled { opacity: 0.5; cursor: progress; }

  .result {
    margin-top: 20px;
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 14px;
  }
  .result.show { display: flex; }

  .result a {
    flex: 1;
    min-width: 0;
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 500;
    font-feature-settings: 'tnum' 1;
    color: var(--ok);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result a:hover { text-decoration: underline; }

  .copy-btn {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border-2);
    color: var(--text);
    font-family: var(--font);
    font-size: 11.5px;
    font-weight: 600;
    padding: 7px 11px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .copy-btn:hover { background: #1c1c1c; }
  .copy-btn.copied { color: var(--ok); border-color: var(--ok); }

  .placeholder {
    margin-top: 20px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    text-align: center;
  }

  .gh-footer {
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .gh-footer a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 7px;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .gh-footer a:hover {
    color: var(--text);
    background: var(--surface);
  }

  .gh-footer svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .gradient-text { animation: none; }
  }
</style>
</head>
<body>

<div class="box">
  <h1>end.lat</h1>
  <p class="tagline">Paste a link, get a <span class="gradient-text">end.lat</span> one back.</p>

  <label for="url">URL</label>
  <input id="url" type="text" placeholder="https://example.com/a/very/long/path" autocomplete="off" spellcheck="false">
  <div class="hint" id="hint"></div>

  <button id="go" onclick="shorten()">Shorten</button>

  <div class="result" id="resultBox">
    <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
    <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy</button>
  </div>

  <div class="placeholder" id="placeholder">Your link will appear right here</div>
</div>

<div class="gh-footer">
  <a href="https://github.com/troojin/end.lat/" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07
        -1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12
        0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27
        1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
        0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
    View on GitHub
  </a>
</div>

<script>
const urlInput    = document.getElementById('url');
const hint        = document.getElementById('hint');
const goBtn       = document.getElementById('go');
const resultBox   = document.getElementById('resultBox');
const placeholder = document.getElementById('placeholder');
const shortLink   = document.getElementById('shortLink');
const copyBtn     = document.getElementById('copyBtn');

function setError(msg) {
  hint.textContent = msg;
  urlInput.classList.toggle('error', !!msg);
}

function isLikelyUrl(value) {
  try {
    const withScheme = /^https?:\/\//i.test(value) ? value : 'https://' + value;
    new URL(withScheme);
    return withScheme;
  } catch {
    return null;
  }
}

async function shorten() {
  setError('');
  const raw = urlInput.value.trim();

  if (!raw) {
    setError('Enter a URL first.');
    urlInput.focus();
    return;
  }

  const normalized = isLikelyUrl(raw);
  if (!normalized) {
    setError("That doesn't look like a valid URL.");
    return;
  }

  goBtn.disabled = true;
  goBtn.textContent = 'Shortening…';
  resultBox.classList.remove('show');
  placeholder.style.display = 'block';

  try {
    const res = await fetch('/api?url=' + encodeURIComponent(normalized));
    if (!res.ok) throw new Error('bad status');
    const data = await res.json();
    if (!data || !data.short) throw new Error('no short link in response');

    shortLink.textContent = data.short;
    shortLink.href = data.short;

    placeholder.style.display = 'none';
    resultBox.classList.add('show');
  } catch (err) {
    setError("Couldn't reach the end.lat API try again in a moment.");
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = 'Shorten';
  }
}

async function copyLink() {
  const text = shortLink.textContent;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    copyBtn.textContent = 'Copied';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }, 1600);
  } catch {
    copyBtn.textContent = 'Failed';
  }
}

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') shorten();
});
urlInput.addEventListener('input', () => setError(''));
</script>
</body>
</html>
