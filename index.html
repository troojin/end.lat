<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>End.lat Shortener</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #000;
    color: white;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.box {
    background: #111;
    padding: 30px;
    width: 350px;
    border-radius: 15px;
    border: 1px solid #222;
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #000;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    background: #080808;
    padding: 10px;
    border-radius: 8px;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="box">
    <h1>End.lat</h1>

    <input id="url" placeholder="Paste URL">

    <button onclick="shorten()">Shorten</button>

    <div class="result" id="result">
        Your link will appear here
    </div>
</div>


<script>
async function shorten() {
    const url = document.getElementById("url").value;

    if (!url) {
        alert("Enter a URL");
        return;
    }

    try {
        const res = await fetch(
            "https://end.lat/api?url=" + encodeURIComponent(url)
        );

        const data = await res.json();

        document.getElementById("result").innerHTML =
            `<a href="${data.short}" target="_blank">${data.short}</a>`;

    } catch (err) {
        document.getElementById("result").innerHTML =
            "API error - check end.lat API endpoint";
    }
}
</script>

</body>
</html>
